<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="સોફા એસ્ટિમેટ" />
    <title>સોફા અને પડદા એસ્ટિમેટ - Sofa & Curtain Quotation</title>
    <!-- Google Fonts: DM Sans & DM Serif Display + Noto Sans Gujarati & Noto Serif Gujarati -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- jsPDF for direct PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      #nl-badge-frame,
      iframe#nl-badge-frame,
      iframe[title="Powered by Netlify"],
      iframe[id*="nl-badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -99999px !important;
        z-index: -999999 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        function removeNetlifyBadge() {
          var nodes = document.querySelectorAll(
            '#nl-badge-frame, iframe[title="Powered by Netlify"], iframe[id*="nl-badge"]'
          );
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].remove();
          }
        }
        removeNetlifyBadge();
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(removeNetlifyBadge);
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        }
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
